name: apply capped-board migrations
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bank-crawl
  cancel-in-progress: false
jobs:
  migrate:
    if: github.repository == 'applyEasy/job-boards'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install .
      - name: Apply and verify nullable timestamp columns
        env:
          BANK_DATABASE_URL: ${{ secrets.BANK_DATABASE_URL }}
        run: python scripts/apply_capped_migrations.py
