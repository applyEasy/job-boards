name: verify Lever closure overlap
on:
  workflow_dispatch:
    inputs:
      start_utc:
        required: true
        type: string
      end_utc:
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: bank-crawl
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository == 'applyEasy/job-boards'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install .
      - name: Compare closed bank IDs with current Lever API
        env:
          BANK_DATABASE_URL: ${{ secrets.BANK_DATABASE_URL }}
          AUDIT_START: ${{ inputs.start_utc }}
          AUDIT_END: ${{ inputs.end_utc }}
        run: python scripts/verify_lever_closures.py --start "$AUDIT_START" --end "$AUDIT_END"
