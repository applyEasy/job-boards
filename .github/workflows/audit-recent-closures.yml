name: audit recent posting closures
on:
  workflow_dispatch:
    inputs:
      start_utc:
        description: Inclusive UTC start, for example 2026-11-13T05:26:40Z
        required: true
        type: string
      end_utc:
        description: Exclusive UTC end, for example 2026-11-13T06:03:04Z
        required: true
        type: string
permissions:
  contents: read
jobs:
  audit:
    if: github.repository == 'applyEasy/job-boards'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install .
      - name: Read closure counts and migration columns
        env:
          BANK_DATABASE_URL: ${{ secrets.BANK_DATABASE_URL }}
          AUDIT_START: ${{ inputs.start_utc }}
          AUDIT_END: ${{ inputs.end_utc }}
        run: python scripts/audit_recent_closures.py --start "$AUDIT_START" --end "$AUDIT_END"
